<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNK Support Admin Dashboard</title><style>body{margin:0;background:#060c09;color:#eef5ee;font-family:Arial}.top{padding:18px 5%;border-bottom:1px solid #263128;display:flex;justify-content:space-between}.wrap{width:min(1100px,90%);margin:28px auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0d1510;border:1px solid #263128;border-radius:18px;padding:20px}.num{font-size:30px;font-weight:900;margin-top:8px}.chart{height:230px;display:flex;align-items:end;gap:10px}.bar{flex:1;background:#aeff32;border-radius:7px 7px 0 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}input,button{width:100%;padding:12px;box-sizing:border-box;margin:7px 0;border-radius:10px}input{background:#080d09;color:#fff;border:1px solid #344239}button{border:0;background:#aeff32;font-weight:900}a{color:#aeff32}.muted{color:#9aa69d}@media(max-width:750px){.grid,.row{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.row{grid-template-columns:1fr}}</style></head><body><header class="top"><b>SNK Support · Admin</b><div><a href="../index.html">View Site</a> <button id="logout" style="width:auto;padding:8px 12px">Logout</button></div></header><main class="wrap"><h1>Dashboard</h1><p class="muted">Demo analytics & branding. Firebase will make this live later.</p><section class="grid"><div class="card">Visitors<div class="num">128</div></div><div class="card">Chats<div class="num">42</div></div><div class="card">Human requests<div class="num">19</div></div><div class="card">Team<div class="num">5</div></div></section><section class="card" style="margin-top:18px"><h2>Weekly activity</h2><div class="chart"><i class="bar" style="height:35%"></i><i class="bar" style="height:52%"></i><i class="bar" style="height:45%"></i><i class="bar" style="height:75%"></i><i class="bar" style="height:60%"></i><i class="bar" style="height:90%"></i><i class="bar" style="height:68%"></i></div></section><section class="row"><div class="card"><h2>Branding</h2><input id="site" placeholder="Site name" value="SNK Support"><input id="logo" placeholder="Logo text" value="S"><button id="save">Save demo branding</button></div><div class="card"><h2>Next setup</h2><p>Firebase Auth + Firestore</p><p>Live charts</p><p>Logo/image upload</p><p>Custom domain + APK packaging</p></div></section></main><script>if(sessionStorage.getItem('snkAdmin')!=='1')location.href='login.html';const b=JSON.parse(localStorage.getItem('snkBrand')||'{}');site.value=b.site||site.value;logo.value=b.logo||logo.value;save.onclick=()=>{localStorage.setItem('snkBrand',JSON.stringify({site:site.value,logo:logo.value}));alert('Saved')};logout.onclick=()=>{sessionStorage.removeItem('snkAdmin');location.href='login.html'}</script></body></html>
