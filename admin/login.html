<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNK Support Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060c09;color:#fff;font-family:Arial}.card{width:min(420px,90%);padding:32px;border:1px solid #263128;border-radius:22px;background:#0d1510}input,button{width:100%;padding:13px;margin:8px 0;border-radius:10px;box-sizing:border-box}input{background:#080d09;border:1px solid #344239;color:#fff}button{border:0;background:#aeff32;font-weight:900}.demo{padding:14px;background:#131e16;border-radius:12px;margin:15px 0}a{color:#aeff32}</style></head><body><main class="card"><h1>SNK Support</h1><h2>Admin Login</h2><p>Demo mode — Firebase later.</p><div class="demo"><b>Email:</b> admin@snksupport.com<br><b>Password:</b> Admin@1234</div><form id="f"><input id="email" type="email" value="admin@snksupport.com" required><input id="password" type="password" value="Admin@1234" required><button>Sign in</button></form><p id="err"></p><a href="../index.html">← Back to website</a></main><script type="module">import{login}from'../firebase/auth.js';f.onsubmit=async e=>{e.preventDefault();try{await login(email.value,password.value);sessionStorage.setItem('snkAdmin','1');location.href='dashboard.html'}catch(x){err.textContent=x.message;err.style.color='#ff9b9b'}}</script></body></html>
